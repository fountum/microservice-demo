apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth
  name: web-app
  namespace: bakery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: app-env
          image: fountum/webapp:latest
          name: web-app
          ports:
            - containerPort: 3001
              protocol: TCP
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: bakery
spec:
  ports:
    - name: "3001"
      port: 3001
      targetPort: 3001
  selector:
    app: auth
