apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.yml convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: web-svr
  name: web-svr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: web-svr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.yml convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: web-svr
    spec:
      containers:
        - image: caddy:latest
          name: web-server
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
