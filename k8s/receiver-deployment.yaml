apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.yml convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: receiver
  name: receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: receiver
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.yml convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: receiver
    spec:
      containers:
        - image: receiver-svc:latest
          name: receiver-svc
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
