apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processing
  name: processing-deploy
  namespace: bakery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing
  template:
    metadata:
      labels:
        app: processing
    spec:
      containers:
        - image: fountum/processing-svc:latest
          name: processing
          ports:
            - containerPort: 8100
              protocol: TCP
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: processing-svc
  namespace: bakery
spec:
  ports:
    - name: "8100"
      port: 8100
      targetPort: 8100
  selector:
    app: processing

