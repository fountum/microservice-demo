apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: receiver
  name: receiver-deploy
  namespace: bakery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receiver
  template:
    metadata:
      labels:
        app: receiver
    spec:
      containers:
        - image: fountum/receiver-svc:latest
          name: receiver
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: receiver-svc
  namespace: bakery
spec:
  ports:
    - name: "8080"
      port: 8080
      targetPort: 8080
  selector:
    app: receiver