openapi: 3.0.3
info:
  description: This API receives bus data from a transit system in a large metropolitian city.
  version: "1.0.0"
  title: Bus API
  contact:
    email: sduong9@my.bcit.ca
paths:
  /bus/ridership:
    post:
      summary: Reports a batch of bus ridership data.
      operationId: app.report_ridership_reading
      description: Adds a batch of ridership data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RidershipReadingBatch'
      responses:
        '201':
          description: batch successfully received
        '400':
          description: 'invalid input, object invalid'
    
  /bus/fuel:
    post:
      summary: Reports a batch of fuel gauge readings.
      operationId: app.report_fuel_reading
      description: Adds a batch of fuel gauge readings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelReadingBatch'
      responses:
        '201':
          description: batch successfully received
        '400':
          description: 'invalid input, object invalid'

components:
  schemas:
    RidershipReading:
      required:
        - stop_id
        - passengers_boarded
        - recorded_timestamp
      properties:
            stop_id:
              type: number
              example: 25519
            passengers_boarded:
              type: number
              example: 7
            recorded_timestamp:
              type: string
              format: date-time
              example: "2016-08-29T09:12:33.001Z"
      type: object

    RidershipReadingBatch:
      required:
      - bus_id
      - route_name
      - batch_timestamp 
      - readings
      properties:
        bus_id:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        route_name:
          type: string
          example: "25 UBC"
        batch_timestamp:
          type: string
          format: date-time
          example: "2016-08-29T09:12:33.001Z"
        readings:
          type: array
          items:
            $ref: "#/components/schemas/RidershipReading"
          
      type: object


    FuelReading:
      required:
        - fuel_litres
        - recorded_timestamp
      properties:
        fuel_litres:
          type: number
          example: 2.3
        recorded_timestamp:
          type: string
          format: date-time
          example: "2016-08-29T09:12:33.001Z"
      type: object

    FuelReadingBatch:
      required:
      - bus_id
      - route_name
      - batch_timestamp
      - readings
      properties:
        bus_id:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        route_name:
          type: string
          example: "25 UBC"
        batch_timestamp:
          type: string
          format: date-time
          example: "2016-08-29T09:12:33.001Z"
        readings:
          type: array
          items:
            $ref: '#/components/schemas/FuelReading'
      type: object