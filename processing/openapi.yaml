openapi: 3.0.3
info:
  description: This API receives bus data from a transit system in a large metropolitian city.
  version: "1.0.0"
  title: Bus API
  contact:
    email: sduong9@my.bcit.ca
paths:
  /stats:
    get:
      summary: Gets stats generated spending data
      operationId: app.get_stats
      description: Gets stats generated from spending data
      responses:
        "200":
          description: Successfully return a stat object
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ReadingStats"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  schemas:
    ReadingStats:
      required:
      - num_spending_reports
      - avg_spending
      - max_spending
      - total_spending
      - last_updated
      properties:
        num_spending_reports:
          type: integer
          example: 50000
        avg_spending:
          type: number
          example: 45.0
        max_spending:
          type: number
          example: 45.0
        total_spending:
          type: number
          example: 45.0
        last_updated:
          type: string
          format: date-time
          example: "2016-08-29 09:12:33"
      type: object
