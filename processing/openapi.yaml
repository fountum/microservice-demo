openapi: 3.0.3
info:
  description: This API receives sales data from a bakery.
  version: "1.0.0"
  title: Sales API
  contact:
    email: sduong9@my.bcit.ca
paths:
  /stats:
    get:
      summary: Gets stats generated sales data
      operationId: app.get_stats
      description: Gets stats generated from sales data
      responses:
        "200":
          description: Successfully return a stat object
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ReadingStats"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  schemas:
    ReadingStats:
      required:
        - num_sales_reports
        - avg_income
        - avg_customers
        - avg_cookies_sold
        - max_income
        - max_customers
        - max_cookies_sold
        - min_income
        - min_customers
        - min_cookies_sold
        - total_income
        - total_customers
        - total_cookies_sold
        - last_updated
      properties:
        num_sales_reports:
          type: integer
          example: 50000
        avg_income:
          type: number
          example: 67.0
        avg_customers:
          type: number
          example: 67.0
        avg_cookies_sold:
          type: number
          example: 67.0
        max_income:
          type: number
          example: 67.0
        max_customers:
          type: number
          example: 67.0
        max_cookies_sold:
          type: number
          example: 67.0
        min_income:
          type: number
          example: 67.0
        min_customers:
          type: number
          example: 67.0
        min_cookies_sold:
          type: number
          example: 67.0
        total_income:
          type: number
          example: 67.0
        total_customers:
          type: number
          example: 67.0
        total_cookies_sold:
          type: number
          example: 67.0
        last_updated:
          type: string
          format: date-time
          example: "2016-08-29 09:12:33"
      type: object
